<title>Selvan Adventure</title>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
    background:#42b9eb;
}

/* =========================
   FIXED SCREEN
========================= */

#game{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:linear-gradient(
        #42b9eb 0%,
        #9ce3f7 65%,
        #dff9ff 100%
    );
}


/* =========================
   MOVING WORLD
========================= */

#world{
    position:absolute;
    left:0;
    top:0;

    width:4000px;
    height:100%;

    will-change:transform;
}


/* =========================
   SUN
========================= */

#sun{

    position:absolute;

    right:500px;
    top:80px;

    width:75px;
    height:75px;

    border-radius:50%;

    background:#fff19a;
}


/* =========================
   CLOUDS
========================= */

.cloud{

    position:absolute;

    width:110px;
    height:35px;

    background:white;

    opacity:.65;

    border-radius:40px;
}

.cloud:before,
.cloud:after{

    content:"";

    position:absolute;

    background:white;

    border-radius:50%;
}

.cloud:before{

    width:55px;
    height:55px;

    left:15px;
    bottom:5px;
}

.cloud:after{

    width:65px;
    height:65px;

    right:10px;
    bottom:0;
}

.c1{
    left:50px;
    top:130px;
}

.c2{
    left:500px;
    top:240px;
}

.c3{
    left:950px;
    top:110px;
}

.c4{
    left:1500px;
    top:220px;
}

.c5{
    left:2200px;
    top:130px;
}

.c6{
    left:2900px;
    top:250px;
}


/* =========================
   MOUNTAINS
========================= */

.mountain{

    position:absolute;

    bottom:125px;

    width:0;
    height:0;

    border-left:150px solid transparent;
    border-right:150px solid transparent;

    border-bottom:240px solid #62b77a;
}

.m1{
    left:0;
}

.m2{
    left:400px;
    border-bottom-color:#55a96d;
}

.m3{
    left:850px;
}

.m4{
    left:1350px;

}

.m5{
    left:1900px;
}

.m6{
    left:2500px;
    border-bottom-color:#55a96d;
}

.m7{
    left:3100px;
}


/* =========================
   GROUND
========================= */

#ground{

    position:absolute;

    left:0;
    bottom:0;

    width:4000px;
    height:125px;

    background:

    linear-gradient(
        to bottom,
        #45b957 0px,
        #45b957 15px,
        #70452b 15px,
        #70452b 100%
    );
}


/* =========================
   PLAYER
========================= */

#player{

    position:absolute;

    left:100px;
    bottom:125px;

    width:44px;
    height:64px;

    z-index:10;

    transition:none;
}
