<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixel Quest Adventure</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#11162b;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}

body{touch-action:none}

#game{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  display:block;
  background:#62c8f4;
}

#hud{
  position:fixed;
  z-index:4;
  top:max(10px,env(safe-area-inset-top));
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  gap:6px;
  pointer-events:none;
}

.badge{
  padding:7px 10px;
  border:3px solid #78839f;
  border-radius:16px;
  background:#171d36dd;
  color:#fff;
  font-weight:900;
  font-size:clamp(13px,3.8vw,18px);
  text-shadow:2px 2px #0008;
  box-shadow:0 5px 15px #0003;
}

#controls{
  position:fixed;
  z-index:5;
  left:0;
  right:0;
  bottom:max(14px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  padding:0 22px;
  pointer-events:none;
}

.group{
  display:flex;
  gap:14px;
}

.btn{
  pointer-events:auto;
  width:68px;
  height:68px;
  border-radius:22px;
  border:3px solid #a9b2c9;
  background:#171d36cc;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:31px;
  font-weight:900;
  box-shadow:0 7px 0 #080b18aa;
  user-select:none;
  -webkit-user-select:none;
}

.btn:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #080b18aa;
  background:#2b3558;
}

#overlay{
  position:fixed;
  z-index:10;
  inset:0;
  background:#0a1022e8;
  display:grid;
  place-items:center;
  padding:20px;
}

.panel{
  width:min(92vw,440px);
  padding:28px 22px;
  border:3px solid #7180a2;
  border-radius:26px;
  background:#171d36f5;
  color:#fff;
  text-align:center;
  box-shadow:0 20px 70px #0008;
}

h1{
  font-size:clamp(34px,10vw,50px);
  margin:0;
  color:#ffe35a;
  text-shadow:4px 4px #b84263;
}

h2{
  color:#7de7ff;
  margin:4px 0 10px;
}

p{
  color:#dbe5ff;
  line-height:1.5;
}

button{
  border:0;
  border-radius:15px;
  padding:13px 22px;
  margin:6px;
  font-size:17px;
  font-weight:900;
  background:#ffd24d;
  color:#17203a;
  box-shadow:0 5px #b47c20;
}

button:active{
  transform:translateY(3px);
  box-shadow:0 2px #b47c20;
}

.secondary{
  background:#72dec6;
  box-shadow:0 5px #3b9d89;
}

.hidden{
  display:none!important;
}

@media (orientation:landscape) and (max-height:520px){
  .btn{
    width:58px;
    height:58px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="badge">⭐ <span id="score">0</span></div>
  <div class="badge">🪙 <span id="coins">0</span></div>
  <div class="badge">❤️ <span id="lives">3</span></div>
  <div class="badge">🌍 <span id="level">1</span></div>
</div>

<div id="controls">

  <div class="group">
    <div class="btn" data-key="left">◀</div>
    <div class="btn" data-key="right">▶</div>
  </div>

  <div class="group">
    <div class="btn" data-key="jump">▲</div>
  </div>

</div>

<div id="overlay">

  <div class="panel">

    <h1>PIXEL QUEST</h1>

    <h2>Adventure</h2>

    <p>
      Run, jump, collect coins,
