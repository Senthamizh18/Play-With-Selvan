<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Selvan Adventure</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#65c8ef;
    touch-action:none;
}

/* GAME */

#game{
    position:fixed;
    left:0;
    top:0;
    width:5000px;
    height:100%;
    overflow:hidden;
    background:linear-gradient(
        #42b9eb 0%,
        #9ce3f7 65%,
        #dff9ff 100%
    );
}

/* SUN */

#sun{
    position:absolute;
    width:75px;
    height:75px;
    border-radius:50%;
    background:#fff19a;
    right:35px;
    top:85px;
}

/* CLOUDS */

.cloud{
    position:absolute;
    width:110px;
    height:35px;
    background:white;
    opacity:.65;
    border-radius:40px;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:55px;
    height:55px;
    left:15px;
    bottom:5px;
}

.cloud:after{
    width:65px;
    height:65px;
    right:10px;
    bottom:0;
}

.c1{
    top:150px;
    left:20px;
}

.c2{
    top:260px;
    left:230px;
}

.c3{
    top:115px;
    left:480px;
}

/* MOUNTAINS */

.mountain{
    position:absolute;
    bottom:120px;
    width:0;
    height:0;
    border-left:130px solid transparent;
    border-right:130px solid transparent;
    border-bottom:230px solid #62b77a;
}

.m1{
    left:-80px;
}

.m2{
    left:180px;
    border-bottom-color:#54a96d;
}

.m3{
    left:430px;
    border-bottom-color:#65b97a;
}

/* GROUND */

#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:5000px;
    height:125px;
    background:
        linear-gradient(
            #43b957 0px,
            #43b957 15px,
            #70452b 15px,
            #70452b 100%
        );
}

/* GROUND DETAILS */

.grass{
    position:absolute;
    bottom:105px;
    width:25px;
    height:12px;
    background:#318e45;
}

/* PLAYER */

#player{
    position:absolute;
    width:44px;
    height:64px;
    left:80px;
    bottom:125px;
    z-index:8;
}

/* hat */

#player .hat{
    position:absolute;
    left:5px;
    top:0;
    width:34px;
    height:15px;
    background:#ed554c;
    border-radius:8px 8px 2px 2px;
}

#player .hat:after{
    content:"";
    position:absolute;
    left:-5px;
    top:10px;
    width:17px;
    height:7px;
    background:#ed554c;
}

/* hair */

#player .hair{
    position:absolute;
    left:9px;
    top:12px;
    width:27px;
    height:22px;
    background:#29324b;
    border-radius:5px;
}

/* face */

#player .face{
    position:absolute;
    left:12px;
    top:18px;
    width:22px;
    height:21px;
    background:#ffd09d;
}

/* eyes */

#player .face:before{
    content:"••";
    position:absolute;
    color:#20263b;
    font-size:13px;
    letter-spacing:5px;
    left:3px;
    top:1px;
}

/* body */

#player .body{
    position:absolute;
    left:7px;
    top:37px;
    width:31px;
    height:17px;
    background:#28b99d;
    border-radius:5px;
}

/* legs */

#player .leg1,
#player .leg2{
    position:absolute;
    top:52px;
    width:13px;
    height:12px;
    background:#29324b;
}

#player .leg1{
    left:5px;
}

#player .leg2{
    right:5px;
}

/* COINS */

.coin{
    position:absolute;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#ffd52f;
    border:3px solid #fff09a;
    color:#a76a14;
    font-weight:bold;
    font-size:17px;
    text-align:center;
    line-height:22px;
    z-index:5;
}

/* ENEMY */

.enemy{
    position:absolute;
    width:43px;
    height:40px;
    background:#d95770;
    border-radius:18px 18px 10px 10px;
    bottom:125px;
    z-index:6;
}

.enemy:before{
    content:"••";
    position:absolute;
    left:10px;
    top:7px;
    color:white;
    font-size:20px;
    letter-spacing:8px;
}

.enemy:after{
    content:"";
    position:absolute;
    left:4px;
    bottom:-5px;
    width:35px;
    height:8px;
    background:#873b5c;
    border-radius:8px;
}

/* FLAG */

#flag{
    position:absolute;
    left:2350px;
    bottom:125px;
    width:10px;
    height:125px;
    background:#29324b;
    z-index:4;
}

#flag:before{
    content:"";
    position:absolute;
    left:8px;
    top:5px;
    width:65px;
    height:38px;
    background:#ff5968;
    clip-path:polygon(
        0 0,
        100% 30%,
        0 65%
    );
}

/* HUD */

#hud{
    position:fixed;
    top:12px;
    left:10px;
    right:10px;
    z-index:30;
    display:flex;
    justify-content:space-between;
}

.hud{
    background:#17203be8;
    color:white;
    border:2px solid #8996b5;
    border-radius:14px;
    padding:8px 10px;
    font-size:14px;
    font-weight:bold;
}

/* CONTROLS */

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:20px;
    z-index:40;
    display:flex;
    justify-content:space-between;
    padding:0 25px;
}

.group{
    display:flex;
    gap:12px;
}

.control{
    width:72px;
    height:72px;
    border-radius:22px;
    border:3px solid #aab5ce;
    background:#111a35dd;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
    box-shadow:0 6px 0 #080d1c;
}

.control:active{
    transform:translateY(5px);
    box-shadow:0 2px 0 #080d1c;
}

/* MESSAGE */

#message{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:50;
    color:white;
    background:#17203bf0;
    border:2px solid #8996b5;
    border-radius:20px;
    padding:22px 28px;
    text-align:center;
    display:none;
}

#message h1{
    color:#ffe35a;
    margin-bottom:8px;
}
</style>
</head>

<body>

<div id="game">

    <div id="sun"></div>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>

    <div id="ground"></div>

    <!-- PLAYER -->

    <div id="player">

        <div class="hat"></div>
        <div class="hair"></div>
        <div class="face"></div>
        <div class="body"></div>
        <div class="leg1"></div>
        <div class="leg2"></div>

    </div>

    <!-- COINS -->

    <div class="coin" style="left:350px;bottom:220px">$</div>
    <div class="coin" style="left:520px;bottom:300px">$</div>
    <div class="coin" style="left:720px;bottom:220px">$</div>
    <div class="coin" style="left:920px;bottom:280px">$</div>
    <div class="coin" style="left:1130px;bottom:220px">$</div>
    <div class="coin" style="left:1350px;bottom:300px">$</div>
    <div class="coin" style="left:1550px;bottom:220px">$</div>
    <div class="coin" style="left:1780px;bottom:280px">$</div>
    <div class="coin" style="left:2000px;bottom:220px">$</div>

    <!-- ENEMIES -->

    <div class="enemy" style="left:620px"></div>
    <div class="enemy" style="left:1050px"></div>
    <div class="enemy" style="left:1450px"></div>
    <div class="enemy" style="left:1880px"></div>

    <!-- FLAG -->

    <div id="flag"></div>

</div>


<!-- HUD -->

<div id="hud">

    <div class="hud">
        ⭐ <span id="score">0</span>
    </div>

    <div class="hud">
        🪙 <span id="coins">0</span>
    </div>

    <div class="hud">
        ❤️ <span id="lives">3</span>
    </div>

    <div class="hud">
        🌍 1
    </div>

</div>


<!-- CONTROLS -->

<div id="controls">

    <div class="group">

        <div class="control" id="left">
            ◀
        </div>

        <div class="control" id="right">
            ▶
        </div>

    </div>

    <div class="group">

        <div class="control" id="jump">
            ▲
        </div>

    </div>

</div>


<div id="message">

    <h1>🏆 YOU WIN!</h1>

    <p>
        Welcome to Selvan Adventure!
    </p>

</div>


<script>

/* ============================
   GAME VARIABLES
============================ */

const player =
document.getElementById("player");

let x = 80;
let y = 0;

let velocityY = 0;

let jumping = false;

let left = false;
let right = false;

let score = 0;
let coins = 0;


/* ============================
   GROUND
============================ */

function groundPosition(){

    return window.innerHeight - 125;

}

function resetPlayer(){

    player.style.left =
        x + "px";

    player.style.bottom =
        "125px";

}

resetPlayer();


/* ============================
   BUTTONS
============================ */

function holdButton(
    element,
    down,
    up
){

    element.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();
            down();

        },
        {passive:false}
    );

    element.addEventListener(
        "touchend",
        function(e){

            e.preventDefault();
            up();

        },
        {passive:false}
    );

    element.addEventListener(
        "touchcancel",
        function(){

            up();

        }
    );

    element.addEventListener(
        "mousedown",
        down
    );

    element.addEventListener(
        "mouseup",
        up
    );

}


holdButton(
    document.getElementById("left"),
    ()=>left=true,
    ()=>left=false
);


holdButton(
    document.getElementById("right"),
    ()=>right=true,
    ()=>right=false
);


document
.getElementById("jump")
.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        jump();

    },
    {passive:false}
);


document
.getElementById("jump")
.addEventListener(
    "mousedown",
    jump
);


/* ============================
   KEYBOARD
============================ */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key==="ArrowLeft")
            left=true;

        if(e.key==="ArrowRight")
            right=true;

        if(
            e.key==="ArrowUp" ||
            e.key===" "
        )
            jump();

    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(e.key==="ArrowLeft")
            left=false;

        if(e.key==="ArrowRight")
            right=false;

    }
);


/* ============================
   JUMP
============================ */

function jump(){

    if(!jumping){

        velocityY=14;

        jumping=true;

    }

}


/* ============================
   COIN COLLECTION
============================ */

function checkCoins(){

    const coinElements =
        document.querySelectorAll(".coin");

    coinElements.forEach(
        function(coin){

            if(
                coin.dataset.collected
            )
                return;

            const coinX =
                parseInt(
                    coin.style.left
                );

            const distance =
                Math.abs(
                    x-coinX
                );

            if(
                distance<45
            ){

                coin.dataset.collected=
                    "yes";

                coin.style.display=
                    "none";

                coins++;

                score+=100;

                document.getElementById(
                    "coins"
                ).textContent=coins;

                document.getElementById(
                    "score"
                ).textContent=score;

            }

        }
    );

}


/* ============================
   GAME LOOP
============================ */

function gameLoop(){

    /* MOVE */

    if(left)
        x-=5;

    if(right)
        x+=5;


    /* LIMIT */

    if(x<0)
        x=0;

    if(x>2350)
        x=2350;


    /* JUMP PHYSICS */

    if(jumping){

        y+=velocityY;

        velocityY-=0.7;


        if(y<=0){

            y=0;

            velocityY=0;

            jumping=false;

        }

    }


    /* PLAYER */

    player.style.left=
        x+"px";

    player.style.bottom=
        (125+y)+"px";


    /* CAMERA */

    const screenCenter=
        window.innerWidth*0.38;

    const camera=
        Math.max(
            0,
            x-screenCenter
        );


    document.getElementById(
        "game"
    ).style.transform=
        "translateX(-"+camera+"px)";


    /* COINS */

    checkCoins();


    /* WIN */

    if(x>=2250){

        document.getElementById(
            "message"
        ).style.display=
            "block";

    }


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
