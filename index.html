<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Pixel Quest</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#10152d;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* HUD */

#hud{
  position:fixed;
  top:12px;
  left:10px;
  right:10px;
  z-index:5;

  display:flex;
  justify-content:space-between;
  gap:6px;

  pointer-events:none;
}

.box{
  background:#141b35e8;
  border:2px solid #8c98b5;
  border-radius:14px;

  color:white;
  font-size:15px;
  font-weight:bold;

  padding:8px 10px;

  box-shadow:0 4px 12px #0005;
}

/* CONTROLS */

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:18px;

  z-index:6;

  display:flex;
  justify-content:space-between;

  padding:0 18px;

  pointer-events:none;
}

.controlGroup{
  display:flex;
  gap:12px;
}

.control{
  width:72px;
  height:72px;

  border-radius:22px;

  background:#151c38dd;

  border:3px solid #aeb8d0;

  color:white;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:32px;
  font-weight:bold;

  box-shadow:
    0 7px 0 #070b18aa;

  pointer-events:auto;

  user-select:none;
}

.control:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #070b18aa;
  background:#354064;
}

/* MENU */

#menu{
  position:fixed;
  inset:0;

  z-index:20;

  background:#080d20dd;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;
}

.panel{
  width:min(92%,430px);

  background:#161e3bf5;

  border:3px solid #7886aa;

  border-radius:25px;

  padding:30px 20px;

  text-align:center;

  color:white;

  box-shadow:0 20px 60px #0009;
}

.panel h1{
  font-size:46px;
  color:#ffe35a;
  text-shadow:4px 4px #b83c61;
}

.panel h2{
  color:#73e7ff;
  margin:5px 0 15px;
}

.panel p{
  color:#d8e4ff;
  line-height:1.5;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:14px;

  padding:14px 25px;

  margin:5px;

  font-size:17px;
  font-weight:bold;

  background:#ffd34d;
  color:#182039;

  box-shadow:0 5px #ae7820;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px #ae7820;
}

#help{
  background:#6edcc4;
  box-shadow:0 5px #398f7e;
}

.hidden{
  display:none!important;
}

/* Small screens */

@media(max-width:380px){

  .control{
    width:62px;
    height:62px;
  }

  .box{
    font-size:13px;
    padding:7px;
  }

}
</style>
</head>

<div id="hud">

  </div>

  </div>

      ▲
    </div>

  </div>

<!-- MENU -->

<div id="menu">

    <h2>SELVA ADVENTURE</h2>

    <p>
      🏃 Run through the world<br>
      🪙 Collect coins<br>
      👾 Jump on enemies<br>
      🏁 Reach the flag
    </p>

    <button id="start">
      ▶ PLAY GAME
    </button>

    <button id="help">
      HOW TO PLAY
    </button>

  </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W;
let H;

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  const dpr=
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width=
    W*dpr;

  canvas.height=
    H*dpr;

  canvas.style.width=
    W+"px";

  canvas.style.height=
    H+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   INPUT
===================================================== */

const input={
  left:false,
  right:false,
  jump:false
};

function button(id,key){

  const el=
    document.getElementById(id);

  const down=e=>{
    e.preventDefault();
    input[key]=true;
  };

  const up=e=>{
    e.preventDefault();
    input[key]=false;
  };

  el.addEventListener(
    "touchstart",
    down,
    {passive:false}
  );

  el.addEventListener(
    "touchend",
    up,
    {passive:false}
  );

  el.addEventListener(
    "touchcancel",
    up,
    {passive:false}
  );

  el.addEventListener(
    "mousedown",
    down
  );

  el.addEventListener(
    "mouseup",
    up
  );

  el.addEventListener(
    "mouseleave",
    up
  );
}

button("left","left");
button("right","right");
button("jump","jump");


/* KEYBOARD */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key==="a"
    )
      input.left=true;

    if(
      e.key==="ArrowRight" ||
      e.key==="d"
    )
      input.right=true;

    if(
      e.key==="ArrowUp" ||
      e.key===" " ||
      e.key==="w"
    )
      input.jump=true;

  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key==="a"
    )
      input.left=false;

    if(
      e.key==="ArrowRight" ||
      e.key==="d"
    )
      input.right=false;

    if(
      e.key==="ArrowUp" ||
      e.key===" " ||
      e.key==="w"
    )
      input.jump=false;

  }
);

let lives=3;
let level=1;
