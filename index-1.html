<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Quest - Adventure</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101426;font-family:system-ui,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#6ec6ff;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(96%,900px);display:flex;justify-content:space-between;gap:8px;color:#fff;font-weight:800;text-shadow:2px 2px #26314f;pointer-events:none;font-size:15px}
.badge{background:#172039cc;border:2px solid #ffffff55;border-radius:12px;padding:7px 10px;backdrop-filter:blur(4px)}
#menu,#pause,#over,#win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#08101dcc;z-index:5}
.panel{width:min(90%,430px);padding:28px 22px;text-align:center;color:white;background:#172039f2;border:3px solid #fff;border-radius:24px;box-shadow:0 15px 50px #0008}
h1{margin:0 0 8px;font-size:42px;color:#ffe45c;text-shadow:4px 4px #b83b5e}
h2{margin:0 0 10px;color:#7ee8ff}
p{line-height:1.5;color:#dce7ff}
button{border:0;border-radius:14px;padding:13px 20px;margin:6px;background:#ffcc42;color:#1c2238;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 0 #b57d20}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b57d20}
.secondary{background:#75ddc5;box-shadow:0 5px 0 #3a9e8a}
#controls{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;z-index:3}
.pad{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:64px;height:64px;border-radius:20px;background:#172039bb;border:2px solid #fff8;color:#fff;font-size:27px;font-weight:900;display:grid;place-items:center;user-select:none;touch-action:none}
.ctrl:active{background:#405078dd}
#hint{font-size:13px;color:#aebddd;margin-top:10px}
.hidden{display:none!important}
@media(min-width:700px){#controls{max-width:900px;margin:auto}.ctrl{width:58px;height:58px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>

<div id="hud">
  <div class="badge">⭐ <span id="score">0</span></div>
  <div class="badge">🪙 <span id="coins">0</span></div>
  <div class="badge">❤️ <span id="lives">3</span></div>
  <div class="badge">🌍 <span id="level">1</span></div>
</div>

<div id="controls">
  <div class="pad">
    <div class="ctrl" data-key="left">◀</div>
    <div class="ctrl" data-key="right">▶</div>
  </div>
  <div class="pad">
    <div class="ctrl" data-key="jump">▲</div>
  </div>
</div>

<div id="menu">
  <div class="panel">
    <h1>PIXEL QUEST</h1>
    <h2>Adventure</h2>
    <p>Run, jump, collect coins and reach the glowing flag!</p>
    <button id="start">▶ PLAY GAME</button>
    <button class="secondary" id="how">HOW TO PLAY</button>
    <div id="hint">Mobile: use ◀ ▶ ▲ &nbsp; • &nbsp; PC: Arrow keys / A D + Space</div>
  </div>
</div>

<div id="pause" class="hidden">
  <div class="panel"><h1>PAUSED</h1><p>Take a breath, adventurer.</p><button id="resume">▶ RESUME</button></div>
</div>

<div id="over" class="hidden">
  <div class="panel"><h1>GAME OVER</h1><p>Score: <b id="finalScore">0</b></p><button id="restart">↻ TRY AGAIN</button></div>
</div>

<div id="win" class="hidden">
  <div class="panel"><h1>YOU WIN! 🏆</h1><p>You completed the adventure!</p><p>Final Score: <b id="winScore">0</b></p><button id="next">▶ PLAY AGAIN</button></div>
</div>
</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=960,H=540,scale=1;
function resize(){
  const ratio=W/H, ww=innerWidth, wh=innerHeight;
  if(ww/wh>ratio){c.height=wh;c.width=wh*ratio}else{c.width=ww;c.height=ww/ratio}
  scale=c.width/W;
}
addEventListener('resize',resize); resize();

const keys={left:false,right:false,jump:false};
let running=false,paused=false,score=0,coinCount=0,lives=3,levelNo=1,cam=0,win=false;
let player,world,enemies,coins,particles,last=0,jumpLock=false;

const levels=[
 {width:4200, platforms:[
  [0,480,760,60],[850,480,500,60],[1440,480,800,60],[2340,480,650,60],[3100,480,1100,60],
  [430,390,160,24],[680,330,150,24],[1050,385,180,24],[1250,300,170,24],
  [1550,385,180,24],[1810,320,180,24],[2040,255,160,24],
  [2480,380,180,24],[2720,315,190,24],[3200,385,180,24],[3500,320,180,24],[3780,250,190,24]
 ]},
 {width:4700, platforms:[
  [0,480,600,60],[700,480,500,60],[1320,480,650,60],[2100,480,420,60],[2650,480,650,60],[3450,480,1250,60],
  [300,390,180,24],[560,320,150,24],[820,380,180,24],[1080,300,170,24],
  [1420,375,170,24],[1660,300,180,24],[1900,235,150,24],
  [2200,365,160,24],[2440,300,150,24],[2780,380,170,24],[3030,310,170,24],
  [3550,390,180,24],[3830,330,180,24],[4120,260,180,24]
 ]}
];

function setup(){
 const L=levels[levelNo-1]; world=L.platforms;
 player={x:80,y:400,w:34,h:48,vx:0,vy:0,onGround:false,inv:0};
 enemies=[
  {x:520,y:432,w:34,h:34,vx:1.1,alive:true},
  {x:1120,y:337,w:34,h:34,vx:-1,alive:true},
  {x:1730,y:337,w:34,h:34,vx:1.2,alive:true},
  {x:2580,y:332,w:34,h:34,vx:-1.1,alive:true},
  {x:3290,y:337,w:34,h:34,vx:1.3,alive:true},
  {x:3890,y:202,w:34,h:34,vx:-1.2,alive:true}
 ];
 coins=[];
 const positions=levelNo===1
 ?[[180,430],[470,340],[720,280],[930,430],[1110,335],[1320,430],[1580,335],[1850,270],[2080,205],[2520,330],[2760,265],[3260,335],[3550,270],[3830,200]]
 :[[180,430],[330,430],[600,270],[850,330],[1110,250],[1460,325],[1690,250],[1930,185],[2240,315],[2470,250],[2830,330],[3070,260],[3600,340],[3860,280],[4160,210]];
 positions.forEach(([x,y])=>coins.push({x,y,r:10,t:Math.random()*6.28,taken:false}));
 particles=[];cam=0;
}

function startGame(){score=0;coinCount=0;lives=3;levelNo=1;win=false;setup();running=true;paused=false;hideAll();last=performance.now();requestAnimationFrame(loop)}
function hideAll(){['menu','pause','over','win'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function rect(a){return {l:a.x,r:a.x+a.w,t:a.y,b:a.y+a.h}}
function collide(a,b){return a.x<b[0]+b[2]&&a.x+a.w>b[0]&&a.y<b[1]+b[3]&&a.y+a.h>b[1]}

function update(dt){
 if(!running||paused)return;
 const sp=0.55, max=6;
 if(keys.left)player.vx-=sp; if(keys.right)player.vx+=sp;
 if(!keys.left&&!keys.right)player.vx*=0.82;
 player.vx=Math.max(-max,Math.min(max,player.vx));
 if(keys.jump&&!jumpLock&&player.onGround){player.vy=-12;jumpLock=true}
 if(!keys.jump)jumpLock=false;
 player.vy+=0.55; if(player.vy>15)player.vy=15;
 let nx=player.x+player.vx,ny=player.y+player.vy;
 player.onGround=false;
 // horizontal walls/platforms
 for(const p of world){
  if(ny+player.h>p[1]+5&&ny<p[1]+p[3]&&player.x+player.w>p[0]&&player.x<p[0]+p[2]){
   if(player.vx>0&&player.x+player.w<=p[0]+Math.abs(player.vx)+5) nx=p[0]-player.w;
   if(player.vx<0&&player.x>=p[0]+p[2]-Math.abs(player.vx)-5) nx=p[0]+p[2];
  }
 }
 player.x=nx;
 for(const p of world){
  if(player.x+player.w>p[0]&&player.x<p[0]+p[2]&&player.y+player.h<=p[1]+12&&ny+player.h>=p[1]&&player.vy>=0){
   ny=p[1]-player.h;player.vy=0;player.onGround=true;
  }
  if(player.x+player.w>p[0]&&player.x<p[0]+p[2]&&player.y>=p[1]+p[3]-4&&ny<=p[1]+p[3]&&player.vy<0){
   ny=p[1]+p[3];player.vy=1;
  }
 }
 player.y=ny;
 if(player.inv>0)player.inv-=dt;
 if(player.x<0)player.x=0;
 if(player.y>H+120){hurt();return}
 for(const co of coins)if(!co.taken&&Math.hypot((player.x+17)-co.x,(player.y+20)-co.y)<30){co.taken=true;coinCount++;score+=100;burst(co.x,co.y,'coin')}
 for(const e of enemies)if(e.alive){
   e.x+=e.vx;
   let nearPlat=world.find(p=>e.x+e.w/2>p[0]&&e.x+e.w/2<p[0]+p[2]&&Math.abs((e.y+e.h)-p[1])<8);
   if(!nearPlat)e.vx*=-1;
   if(collide(player,e)){
     if(player.vy>2&&player.y+player.h<e.y+18){e.alive=false;player.vy=-8;score+=250;burst(e.x,e.y,'hit')}
     else hurt();
   }
 }
 if(player.inv<=0)player.inv=0;
 const target=player.x-W*.38;cam+=(Math.max(0,Math.min(levels[levelNo-1].width-W,target))-cam)*0.12;
 if(player.x>levels[levelNo-1].width-180){nextLevel()}
 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
}

function hurt(){
 if(player.inv>0)return;
 lives--; burst(player.x,player.y,'hurt');
 if(lives<=0){running=false;document.getElementById('finalScore').textContent=score;document.getElementById('over').classList.remove('hidden');return}
 player.x=Math.max(50,player.x-180);player.y=250;player.vx=0;player.vy=0;player.inv=1.8;
}
function nextLevel(){
 if(levelNo<levels.length){levelNo++;score+=1000;setup()}
 else{running=false;document.getElementById('winScore').textContent=score;document.getElementById('win').classList.remove('hidden')}
}
function burst(x,y,type){
 for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:.5+Math.random()*.5,type});
}

function draw(){
 ctx.clearRect(0,0,W,H);
 drawSky();ctx.save();ctx.translate(-cam,0);
 for(const p of world)drawPlatform(p);
 for(const co of coins)if(!co.taken)drawCoin(co);
 for(const e of enemies)if(e.alive)drawEnemy(e);
 drawFlag(levels[levelNo-1].width-120,420);
 if(player.inv<=0||Math.floor(performance.now()/100)%2)drawPlayer(player);
 for(const p of particles)drawParticle(p);
 ctx.restore();
 document.getElementById('score').textContent=score;
 document.getElementById('coins').textContent=coinCount;
 document.getElementById('lives').textContent=lives;
 document.getElementById('level').textContent=levelNo;
}

function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#55bdf4');g.addColorStop(1,'#d5f4ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffffff88';for(let i=0;i<8;i++){let x=(i*170-(cam*.15))%1100,y=70+(i%3)*65;ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.arc(x+28,y-7,32,0,7);ctx.arc(x+62,y,22,0,7);ctx.fill()}
 ctx.fillStyle='#78c987';for(let i=-1;i<8;i++){let x=i*260-(cam*.25);ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x+120,330);ctx.lineTo(x+260,H);ctx.fill()}
}
function drawPlatform(p){
 ctx.fillStyle='#6c452c';ctx.fillRect(p[0],p[1],p[2],p[3]);
 ctx.fillStyle='#49b95d';ctx.fillRect(p[0],p[1],p[2],9);
 ctx.fillStyle='#328b48';for(let x=p[0]+10;x<p[0]+p[2];x+=28)ctx.fillRect(x,p[1]+12,8,7);
}
function drawPlayer(a){
 ctx.save();ctx.translate(a.x,a.y);
 // original adventurer
 ctx.fillStyle='#30395c';ctx.fillRect(7,8,20,16);
 ctx.fillStyle='#ffd2a1';ctx.fillRect(9,18,18,16);
 ctx.fillStyle='#ff7b54';ctx.fillRect(5,5,25,8);
 ctx.fillStyle='#ffd2a1';ctx.fillRect(2,13,7,7);
 ctx.fillStyle='#28304b';ctx.fillRect(10,23,3,4);ctx.fillRect(22,23,3,4);
 ctx.fillStyle='#36c6a5';ctx.fillRect(7,34,20,11);
 ctx.fillStyle='#27314d';ctx.fillRect(6,44,9,5);ctx.fillRect(21,44,9,5);
 ctx.restore();
}
function drawEnemy(e){
 ctx.save();ctx.translate(e.x,e.y);
 ctx.fillStyle='#9b3f66';ctx.fillRect(2,8,30,22);
 ctx.fillStyle='#e45b70';ctx.fillRect(7,3,20,27);
 ctx.fillStyle='#fff';ctx.fillRect(9,12,5,6);ctx.fillRect(21,12,5,6);
 ctx.fillStyle='#24253c';ctx.fillRect(11,14,3,3);ctx.fillRect(22,14,3,3);
 ctx.fillStyle='#24253c';ctx.fillRect(3,29,9,5);ctx.fillRect(23,29,9,5);
 ctx.restore();
}
function drawCoin(co){
 const bob=Math.sin(performance.now()/160+co.t)*4;
 ctx.save();ctx.translate(co.x,co.y+bob);
 ctx.fillStyle='#ffdc45';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
 ctx.strokeStyle='#fff2a1';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#bd7c20';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('$',0,5);ctx.restore();
}
function drawFlag(x,y){
 ctx.fillStyle='#29314d';ctx.fillRect(x,y-70,7,70);
 ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.moveTo(x+7,y-68);ctx.lineTo(x+58,y-54);ctx.lineTo(x+7,y-35);ctx.fill();
 ctx.fillStyle='#ffe45c';ctx.beginPath();ctx.arc(x+3,y+4,8,0,7);ctx.fill();
}
function drawParticle(p){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.type==='coin'?'#ffe45c':'#ff7188';ctx.fillRect(p.x,p.y,5,5);ctx.globalAlpha=1}

function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
function bind(el,key){
 const down=e=>{e.preventDefault();keys[key]=true};
 const up=e=>{e.preventDefault();keys[key]=false};
 el.addEventListener('touchstart',down,{passive:false});el.addEventListener('touchend',up,{passive:false});el.addEventListener('touchcancel',up,{passive:false});
 el.addEventListener('mousedown',down);el.addEventListener('mouseup',up);el.addEventListener('mouseleave',up);
}
document.querySelectorAll('.ctrl').forEach(el=>bind(el,el.dataset.key));
addEventListener('keydown',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
 if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
 if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.jump=true;
 if(e.code==='Escape'&&running){paused=!paused;document.getElementById('pause').classList.toggle('hidden',!paused)}
});
addEventListener('keyup',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
 if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
 if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')keys.jump=false;
});
document.getElementById('start').onclick=startGame;
document.getElementById('restart').onclick=startGame;
document.getElementById('next').onclick=startGame;
document.getElementById('resume').onclick=()=>{paused=false;document.getElementById('pause').classList.add('hidden')};
document.getElementById('how').onclick=()=>alert('Collect coins 🪙, jump on enemies 👾, avoid falling, and reach the flag 🏁. Mobile: ◀ ▶ ▲. PC: Arrow keys or A/D + Space.');
</script>
</body>
</html>
